<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Site Chat - Loading</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      height: 100vh;
      width: 380px;
    }

    body {
      height: 100vh;
      width: 380px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
      overflow: hidden;
      gap: 24px;
    }

    body.slide-out {
      transform: translateX(-100%);
      transition: transform 0.6s ease-in-out;
    }

    .loader-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    /* Modern dots loader */
    .dots-loader {
      display: flex;
      gap: 8px;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: white;
      animation: pulse 1.4s infinite;
    }

    .dot:nth-child(1) {
      animation-delay: 0s;
    }

    .dot:nth-child(2) {
      animation-delay: 0.2s;
    }

    .dot:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes pulse {
      0%, 80%, 100% {
        opacity: 0.3;
        transform: scale(0.8);
      }
      40% {
        opacity: 1;
        transform: scale(1);
      }
    }

    .loader-text {
      font-size: 16px;
      color: white;
      font-weight: 500;
      letter-spacing: 0.5px;
      animation: fadeInOut 2s infinite;
    }

    @keyframes fadeInOut {
      0%, 100% {
        opacity: 0.7;
      }
      50% {
        opacity: 1;
      }
    }

    .loading-tips {
      position: absolute;
      bottom: 32px;
      text-align: center;
      color: rgba(255, 255, 255, 0.8);
      font-size: 12px;
      max-width: 320px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="loader-container">
    <div class="dots-loader">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
    <p class="loader-text">Analyzing page content...</p>
  </div>

  <div class="loading-tips">
    <p>🔍 Extracting content and preparing AI analysis...<br>This usually takes a few seconds.</p>
  </div>

  <script src="loading.js"></script>
</body>
</html>
