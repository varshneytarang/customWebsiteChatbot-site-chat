<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Site Chat</title>
  <link rel="stylesheet" href="popup.css"/>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <h2 class="title">Site Chat</h2>
      <span class="status" id="status">Ready</span>
    </div>
    <button id="help" class="btn-icon" title="Help">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="10" cy="10" r="9" stroke="currentColor" stroke-width="1.5"/>
        <path d="M10 7C9.4 7 9 7.4 9 8C9 8.55 9.45 9 10 9C10.55 9 11 8.55 11 8C11 7.45 10.55 7 10 7Z" fill="currentColor"/>
        <path d="M10 10C9.45 10 9 10.45 9 11V13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </button>
  </div>

  <!-- Chat Box -->
  <div id="chatbox" class="chatbox"></div>

  <!-- Input Area -->
  <div class="input-area">
    <div class="input-wrapper">
      <textarea 
        id="question" 
        class="textarea-input"
        placeholder="Ask something about this page..."
        rows="1"
      ></textarea>
      <button id="askBtn" class="btn-send" title="Send">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M16.5 1.5L1 9l15.5 7.5M1 9h11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Loader -->
  <div id="loader" class="loader">
    <div class="loader-dot"></div>
    <div class="loader-dot"></div>
    <div class="loader-dot"></div>
  </div>

  <!-- Help Modal -->
  <div id="modal" class="modal">
    <div class="modal-overlay"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h3>How It Works</h3>
        <button class="close" id="closePopup">×</button>
      </div>
      <div class="modal-body">
        <p>💡 <strong>Tip:</strong> Make sure the page is fully loaded before asking questions for best results.</p>
        <h4>Features:</h4>
        <ul>
          <li>Ask any question about the current webpage</li>
          <li>AI analyzes the content and provides answers</li>
          <li>Keep the conversation going for follow-ups</li>
        </ul>
      </div>
    </div>
  </div>

  <script src="popup1.js"></script>
</body>
</html>
